<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wiki-Guesser — game room</title>
<meta name="robots" content="noindex" />
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">Wiki-Guesser</a>
    <div class="nav-right">
      <button class="theme-toggle" data-theme-toggle title="Toggle theme">Theme</button>
      <span id="user-pill" class="nav-right"></span>
      <button class="ghost small" id="btn-leave">Leave</button>
    </div>
  </nav>

  <div class="container">
    <div class="game-top">
      <div>
        <span class="round-chip" id="room-label">Room</span>
        <span class="round-chip" id="round-label"></span>
      </div>
      <div class="timer" id="timer"></div>
    </div>

    <div class="stage">
      <!-- Main column -->
      <div>
        <div id="image-frame"><div class="loading" id="frame-msg">Joining room…</div></div>

        <!-- Guess input (during a round) -->
        <div class="guess-area hidden" id="guess-area">
          <input type="text" id="guess-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your guess…" />
          <button class="primary" id="guess-submit">Guess</button>
        </div>
        <p class="hint" id="guess-hint" style="margin-top:0.5rem"></p>

        <!-- Reveal panel -->
        <div class="reveal card hidden" id="reveal-panel">
          <div class="hint">The answer was</div>
          <div class="answer" id="reveal-answer"></div>
          <div class="answer-desc" id="reveal-desc"></div>
          <div class="result-list" id="reveal-results"></div>
        </div>

        <!-- Game over -->
        <div class="reveal card hidden" id="over-panel">
          <h2 id="over-title">Game over</h2>
          <p class="muted" id="over-note"></p>
          <div class="result-list" id="over-standings"></div>
          <div id="over-recap"></div>
          <div id="over-actions" style="margin-top:1rem; display:flex; gap:0.6rem; justify-content:center; flex-wrap:wrap;"></div>
        </div>
      </div>

      <!-- Sidebar -->
      <div class="side">
        <div class="card">
          <h2 style="font-size:1.1rem; margin-bottom:0.6rem;">Players</h2>
          <div class="players-list" id="players-list"></div>
        </div>

        <!-- Lobby controls. The invite link and the rules are private-room only:
             a matchmaking room has nobody to invite, and its settings are fixed
             by the queue its players chose. -->
        <div class="card lobby-box hidden" id="lobby-box">
          <!-- The code is the thing people actually pass around — read out loud,
               typed into "Join by code" on the lobby. So it is shown big and is
               itself the button that copies it. The link is plain wrapping text
               rather than a read-only input: at sidebar width an input showed
               about as far as "https://" and looked broken. -->
          <div id="invite-block">
            <div class="hint">Invite your friends</div>
            <div class="invite">
              <button class="invite-code" id="btn-copy-code" title="Copy the room code">
                <span class="invite-code-label">Room code</span>
                <span class="invite-code-value" id="room-code">—</span>
              </button>
              <!-- The label is broken over two lines to keep the button narrow;
                   the aria-label is what stops that reading as "Copylink". -->
              <button class="primary invite-copy" id="btn-copy" aria-label="Copy the invite link">Copy<br />link</button>
            </div>
            <p class="hint invite-link" id="share-link"></p>
          </div>
          <div class="settings-row" id="host-settings">
            <div class="field">
              <label>Rounds</label>
              <select id="set-rounds">
                <option>3</option><option selected>5</option><option>7</option><option>10</option>
              </select>
            </div>
            <div class="field">
              <label>Seconds per round</label>
              <select id="set-seconds">
                <option value="10">10 — blitz</option>
                <option value="15">15</option>
                <option value="20" selected>20</option>
                <option value="30">30</option>
                <option value="45">45</option>
                <option value="60">60 — relaxed</option>
              </select>
            </div>
            <!-- `wide` on the three with sentence-length options: at sidebar
                 width they share a row with nothing and clip if they try. -->
            <div class="field wide">
              <label>Clue</label>
              <select id="set-clue">
                <option value="image">Pictures</option>
                <option value="text">Descriptions</option>
                <option value="mixed">Combined</option>
              </select>
            </div>
            <div class="field wide">
              <label>Difficulty</label>
              <select id="set-mode">
                <option value="party">Party mix — well-known topics</option>
                <option value="chaos">Total chaos — broader mix</option>
              </select>
            </div>
            <div class="field wide">
              <label>Chat</label>
              <select id="set-chat">
                <option value="true">On</option>
                <option value="false">Off for everyone</option>
              </select>
            </div>
          </div>

          <div class="cat-picker" id="cat-picker">
            <div class="cat-head">
              <label>Categories</label>
              <button class="ghost tiny" id="cat-clear">Anything</button>
            </div>
            <div class="cat-grid" id="cat-grid"></div>
            <p class="hint" id="cat-note"></p>
          </div>
          <button class="primary" id="btn-start">Start game</button>
          <p class="hint" id="lobby-hint"></p>
        </div>

        <!-- Chat -->
        <div class="card chat" id="chat-card">
          <div class="chat-head">
            <span class="chat-title">Chat</span>
            <button class="ghost tiny" id="chat-toggle" title="Hide chat for yourself, on every device">Hide</button>
          </div>
          <div id="chat-body">
            <div class="chat-log" id="chat-log"></div>
            <div class="chat-row">
              <input type="text" id="chat-input" maxlength="200" placeholder="Say something…" />
              <button class="small" id="chat-send">Send</button>
            </div>
            <p class="hint chat-hint">Use the ⚑ on a message to report it.</p>
          </div>
          <p class="hint hidden" id="chat-hidden-note">
            Chat is hidden. This setting follows your account, so it stays off in your next game too.
          </p>
        </div>

        <!-- Ad: sidebar -->
        <div class="ad-slot" data-ad="side" style="min-height:250px">Ad space</div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/play.js"></script>
</body>
</html>
